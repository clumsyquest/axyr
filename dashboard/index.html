<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Axyr — Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>

<!-- React (no build step, no JSX — the components use React.createElement directly) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

<!-- App modules, in dependency order. They share globals (classic scripts). -->
<script src="app/data.js"></script>
<script src="app/icons.js"></script>
<script src="app/files.js"></script>
<script src="app/map.js"></script>
<script src="app/panels.js"></script>
<script src="app/crash.js"></script>
<script src="app/agent.js"></script>
<script src="app/live.js"></script>
<script src="app/app.js"></script>

<!-- Mount: try the live engine first; fall back to the bundled real demo data. -->
<script>
(async function () {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  if (window.AxLive) {
    try { await window.AxLive.hydrate(); }
    catch (e) { console.info('Axyr: engine not reachable — showing demo data.', e); }
  }
  const render = () => root.render(React.createElement(window.AxApp));
  render();
  if (window.AxLive && window.AX_LIVE) window.AxLive.startPolling();
})();
</script>
</body>
</html>
