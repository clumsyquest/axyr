# Crash post-mortem capture via Zephyr coredump.
# Backend = IN_MEMORY: the dump is written to a RAM buffer (fast, no log, no hex)
# that the host reads directly over SWD while the core is halted after the fault.
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_IN_MEMORY=y
CONFIG_DEBUG_COREDUMP_BACKEND_IN_MEMORY_SIZE=4096
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y

# AXYR_CRASH packet + fault dump + coredump markers go over SEGGER RTT (no UART).
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n

# Synchronous logging so the fault dump + markers reach RTT before the CPU halts.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
