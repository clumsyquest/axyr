# Crash post-mortem capture via Zephyr coredump, emitted over RTT (not UART).
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y

# Telemetry/crash over SEGGER RTT instead of the serial port.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n

# Synchronous logging so fault/coredump messages reach RTT before the CPU halts.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
