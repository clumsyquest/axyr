# Build and publish the `axyr` agent binary.
#
# On a `v*` tag: build for the four supported targets, checksum everything,
# and attach it all to a GitHub Release — what install.sh downloads.
# `workflow_dispatch` runs the same builds without publishing (dry run).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04: oldest supported glibc, so the binary runs on more distros.
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, runner: macos-13 }
          - { target: aarch64-apple-darwin, runner: macos-14 }
    steps:
      - uses: actions/checkout@v4

      # hidapi (CMSIS-DAP v1 probes) builds against libudev on Linux.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust (stable)
        run: rustup update stable && rustup default stable

      - name: Build
        working-directory: engine
        run: cargo build --release --locked --bin axyr

      - name: Package
        run: |
          mkdir dist
          cp engine/target/release/axyr dist/
          tar -C dist -czf "axyr-${{ matrix.target }}.tar.gz" axyr

      - uses: actions/upload-artifact@v4
        with:
          name: axyr-${{ matrix.target }}
          path: axyr-*.tar.gz
          if-no-files-found: error

  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum axyr-*.tar.gz > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "axyr $GITHUB_REF_NAME" \
            --generate-notes
