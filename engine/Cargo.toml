[package]
name = "axyr-engine"
version = "0.1.0"
edition = "2024"

# The agent the developer runs: `axyr` (auto-detects probe + build, serves the
# dashboard API + MCP). Same entrypoint as before; just the friendly name.
[[bin]]
name = "axyr"
path = "src/main.rs"

[[bin]]
name = "axyr-engined"
path = "src/bin/engined.rs"

[dependencies]
addr2line = "0.26.1"
base64 = "0.22"
gimli = "0.33.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
sha1 = "0.10"
tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
object = { version = "0.39.1", default-features = false, features = ["read"] }
probe-rs = "0.31.0"
serde_json = "1.0.150"
serialport = "4.9.0"
svd-parser = { version = "0.14.9", features = ["expand"] }
tiny_http = "0.12.0"
